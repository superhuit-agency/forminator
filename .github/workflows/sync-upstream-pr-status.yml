name: Refresh upstream sync PR status

# Re-checks the local patches whenever an upstream sync PR branch is pushed to
# (e.g. after manually fixing a patch that failed to apply), then updates the
# PR title, description status block and draft state to match.
#
# Pushes made by the sync workflow itself use GITHUB_TOKEN and therefore do not
# trigger this workflow; only manual pushes do.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-upstream-pr-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  status:
    if: startsWith(github.head_ref, 'chore/sync-upstream-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check local patches
        id: check
        shell: bash
        run: |
          set -euo pipefail

          out="$(bash tools/check-patches.sh)"
          echo "${out}"

          applied="$(echo "${out}" | grep -E '^FORMINATOR_PATCH_APPLIED=' | tail -n 1 | cut -d= -f2)"
          note="$(echo "${out}" | grep -E '^FORMINATOR_PATCH_NOTE=' | tail -n 1 | cut -d= -f2-)"

          echo "applied=${applied}" >> "${GITHUB_OUTPUT}"
          echo "note=${note}" >> "${GITHUB_OUTPUT}"

      - name: Update PR title, description and draft state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APPLIED: ${{ steps.check.outputs.applied }}
          NOTE: ${{ steps.check.outputs.note }}
        run: |
          set -euo pipefail

          tag="${GITHUB_HEAD_REF#chore/sync-upstream-}"

          title="chore(upstream): sync Forminator ${tag}"
          if [[ "${APPLIED}" != "1" ]]; then
            title="WIP: ${title} (patches NOT applied)"
          fi

          status_file="${RUNNER_TEMP}/sync-status.md"
          current_file="${RUNNER_TEMP}/pr-body-current.md"
          body_file="${RUNNER_TEMP}/pr-body.md"

          bash tools/render-sync-pr-body.sh "${tag}" "${APPLIED}" "${NOTE}" > "${status_file}"
          gh pr view "${PR_NUMBER}" --json body --jq .body > "${current_file}"

          # Replace only the marked status block, keeping notes added around it.
          # PRs opened before the markers existed get the whole body replaced.
          python3 - "${current_file}" "${status_file}" > "${body_file}" <<'PY'
          import re, sys
          body = open(sys.argv[1]).read()
          block = open(sys.argv[2]).read().strip()
          pattern = re.compile(r"<!-- sync-status:start -->.*?<!-- sync-status:end -->", re.S)
          print(pattern.sub(lambda _: block, body, count=1) if pattern.search(body) else block)
          PY

          gh pr edit "${PR_NUMBER}" --title "${title}" --body-file "${body_file}"

          is_draft="$(gh pr view "${PR_NUMBER}" --json isDraft --jq .isDraft)"
          if [[ "${APPLIED}" == "1" && "${is_draft}" == "true" ]]; then
            gh pr ready "${PR_NUMBER}"
          elif [[ "${APPLIED}" != "1" && "${is_draft}" == "false" ]]; then
            gh pr ready "${PR_NUMBER}" --undo
          fi
